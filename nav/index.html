<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fluids and singularities</title>
<style>
  :root{
    --bg:#060F13;
    --tank:#08151B;
    --line:#1C2F38;
    --text:#D6E2E7;
    --dim:#7B959F;
    --ui:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:var(--bg);color:var(--text);font-family:var(--ui);font-size:13px}
  #app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:0}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
  header h1{font-size:14px;font-weight:500;margin:0;letter-spacing:0.02em}
  main{display:grid;grid-template-columns:1fr 1fr;min-height:0}
  section{display:grid;grid-template-rows:auto 1fr auto;min-height:0;min-width:0;padding:12px 14px 10px}
  section+section{border-left:1px solid var(--line)}
  h2{font-size:15px;font-weight:500;margin:0 0 8px}
  .stage{position:relative;min-height:0;background:var(--tank);border-radius:2px;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #tank{cursor:crosshair}
  #vortex{cursor:grab}
  #vortex:active{cursor:grabbing}
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:9px;color:var(--dim)}
  label.chk{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
  label.chk input{width:14px;height:14px;accent-color:#56C7E0;margin:0}
  button{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:2px;padding:4px 11px;cursor:pointer}
  button:hover{background:var(--line)}
  :focus-visible{outline:2px solid #56C7E0;outline-offset:2px}
  input[type=range]{flex:1;min-width:80px;accent-color:#EF9F27;height:18px}
  .num{font-family:var(--mono);color:var(--text);font-variant-numeric:tabular-nums}
  .warn{color:#EF9F27}
  @media (max-width:820px){
    main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
    section+section{border-left:none;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div id="app">

<header>
  <h1>Fluid dynamics and the Navier–Stokes singularity</h1>
  <button id="bFull">Maximise</button>
</header>

<main>

  <section>
    <h2>Push the fluid</h2>
    <div class="stage"><canvas id="tank" aria-label="Fluid tank. Drag to stir."></canvas></div>
    <div class="bar">
      <label class="chk"><input type="checkbox" id="cAdv" checked />Advection</label>
      <label class="chk"><input type="checkbox" id="cDif" checked />Viscosity</label>
      <label class="chk"><input type="checkbox" id="cPrj" checked />Pressure</label>
      <label class="chk"><input type="checkbox" id="cVort" />Vorticity</label>
      <button id="bStir">Stir</button>
      <button id="bReset">Reset</button>
      <label class="chk" style="flex:1;min-width:150px">ν <input type="range" id="sVisc" min="0" max="100" step="1" value="20" style="accent-color:#56C7E0" aria-label="Viscosity" /><span class="num" id="oVisc">0.000020</span></label>
      <span>∇·u <span class="num" id="oDiv">0.00</span></span>
      <span>‖u‖ <span class="num" id="oSpdF">0.0</span></span>
    </div>
  </section>

  <section>
    <h2>A vortex running out of time</h2>
    <div class="stage"><canvas id="vortex" aria-label="Vortex approaching a finite-time singularity. Drag to rotate."></canvas></div>
    <div class="bar">
      <button id="bPlay" style="min-width:74px">Pause</button>
      <input type="range" id="sScrub" min="0" max="1000" step="1" value="0" aria-label="Time toward blowup" />
      <span>T−t <span class="num" id="oTau">1.000</span></span>
      <span>‖u‖ <span class="num" id="oSpd">1.0×</span></span>
    </div>
  </section>

</main>
</div>

<script>
document.getElementById('bFull').addEventListener('click', function(){
  var b = this;
  if (!document.fullscreenElement){
    (document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : Promise.reject()).catch(function(){});
  } else if (document.exitFullscreen) { document.exitFullscreen(); }
});
document.addEventListener('fullscreenchange', function(){
  document.getElementById('bFull').textContent = document.fullscreenElement ? 'Exit' : 'Maximise';
});

/* ---------- left: stable fluids ---------- */
(function(){
var N = 110, W1 = N + 2, SZ = W1 * W1, ITER = 16;
function IX(i,j){ return i + W1 * j; }
var u = new Float32Array(SZ), v = new Float32Array(SZ);
var u0 = new Float32Array(SZ), v0 = new Float32Array(SZ);
var visc = 0.00002, dt = 0.11;

var cAdv = document.getElementById('cAdv'), cDif = document.getElementById('cDif'),
    cPrj = document.getElementById('cPrj'), cVort = document.getElementById('cVort'),
    oDiv = document.getElementById('oDiv'), oSpdF = document.getElementById('oSpdF'),
    sVisc = document.getElementById('sVisc'), oVisc = document.getElementById('oVisc');

function readVisc(){
  var t = sVisc.value/100;
  visc = t === 0 ? 0 : 0.000001*Math.pow(10, t*3.4);
  oVisc.textContent = visc.toFixed(6);
}
sVisc.addEventListener('input', readVisc);
readVisc();

function setBnd(b, x){
  for (var i = 1; i <= N; i++){
    x[IX(0,i)]   = b === 1 ? -x[IX(1,i)] : x[IX(1,i)];
    x[IX(N+1,i)] = b === 1 ? -x[IX(N,i)] : x[IX(N,i)];
    x[IX(i,0)]   = b === 2 ? -x[IX(i,1)] : x[IX(i,1)];
    x[IX(i,N+1)] = b === 2 ? -x[IX(i,N)] : x[IX(i,N)];
  }
  x[IX(0,0)]     = 0.5*(x[IX(1,0)]   + x[IX(0,1)]);
  x[IX(0,N+1)]   = 0.5*(x[IX(1,N+1)] + x[IX(0,N)]);
  x[IX(N+1,0)]   = 0.5*(x[IX(N,0)]   + x[IX(N+1,1)]);
  x[IX(N+1,N+1)] = 0.5*(x[IX(N,N+1)] + x[IX(N+1,N)]);
}
function linSolve(b, x, xs, a, c){
  var invc = 1/c, i, j, k, id;
  for (k = 0; k < ITER; k++){
    for (j = 1; j <= N; j++){
      for (i = 1; i <= N; i++){
        id = IX(i,j);
        x[id] = (xs[id] + a*(x[id-1] + x[id+1] + x[id-W1] + x[id+W1])) * invc;
      }
    }
    setBnd(b, x);
  }
}
function advect(b, d, d0, uu, vv){
  var dt0 = dt * N, i, j;
  for (j = 1; j <= N; j++){
    for (i = 1; i <= N; i++){
      var id = IX(i,j);
      var x = i - dt0*uu[id], y = j - dt0*vv[id];
      if (x < 0.5) x = 0.5; if (x > N + 0.5) x = N + 0.5;
      if (y < 0.5) y = 0.5; if (y > N + 0.5) y = N + 0.5;
      var i0 = x|0, j0 = y|0, s1 = x - i0, s0 = 1 - s1, t1 = y - j0, t0 = 1 - t1;
      d[id] = s0*(t0*d0[IX(i0,j0)] + t1*d0[IX(i0,j0+1)]) + s1*(t0*d0[IX(i0+1,j0)] + t1*d0[IX(i0+1,j0+1)]);
    }
  }
  setBnd(b, d);
}
function project(uu, vv, p, div){
  var i, j, h = 1/N;
  for (j = 1; j <= N; j++) for (i = 1; i <= N; i++){
    div[IX(i,j)] = -0.5*h*(uu[IX(i+1,j)] - uu[IX(i-1,j)] + vv[IX(i,j+1)] - vv[IX(i,j-1)]);
    p[IX(i,j)] = 0;
  }
  setBnd(0, div); setBnd(0, p);
  linSolve(0, p, div, 1, 4);
  for (j = 1; j <= N; j++) for (i = 1; i <= N; i++){
    uu[IX(i,j)] -= 0.5*(p[IX(i+1,j)] - p[IX(i-1,j)])/h;
    vv[IX(i,j)] -= 0.5*(p[IX(i,j+1)] - p[IX(i,j-1)])/h;
  }
  setBnd(1, uu); setBnd(2, vv);
}
function velStep(){
  var i, t;
  for (i = 0; i < SZ; i++){ u[i] += dt*u0[i]; v[i] += dt*v0[i]; }
  t = u0; u0 = u; u = t;
  if (cDif.checked){ var a = dt*visc*N*N; linSolve(1, u, u0, a, 1 + 4*a); } else u.set(u0);
  t = v0; v0 = v; v = t;
  if (cDif.checked){ var a2 = dt*visc*N*N; linSolve(2, v, v0, a2, 1 + 4*a2); } else v.set(v0);
  if (cPrj.checked) project(u, v, u0, v0);
  if (cAdv.checked){
    t = u0; u0 = u; u = t;
    t = v0; v0 = v; v = t;
    advect(1, u, u0, u0, v0);
    advect(2, v, v0, u0, v0);
  }
  if (cPrj.checked) project(u, v, u0, v0);
  for (i = 0; i < SZ; i++){
    if (!isFinite(u[i])) u[i] = 0;
    if (!isFinite(v[i])) v[i] = 0;
    if (u[i] > 60) u[i] = 60; else if (u[i] < -60) u[i] = -60;
    if (v[i] > 60) v[i] = 60; else if (v[i] < -60) v[i] = -60;
  }
  u0.fill(0); v0.fill(0);
}

var NP = 3200, px = new Float32Array(NP), py = new Float32Array(NP),
    pb = new Uint8Array(NP), pl = new Float32Array(NP), BINS = 8, binColor = [];
for (var b = 0; b < BINS; b++){
  var m = b/(BINS-1);
  binColor.push('rgba(' + Math.round(86+156*m) + ',' + Math.round(199-38*m) + ',' + Math.round(224-161*m) + ',0.85)');
}
function seed(k){ px[k] = Math.random(); py[k] = Math.random(); pb[k] = Math.min(BINS-1,(px[k]*BINS)|0); pl[k] = 6 + Math.random()*10; }
for (var k0 = 0; k0 < NP; k0++) seed(k0);

function sample(f, x, y){
  var gx = x*N + 0.5, gy = y*N + 0.5;
  if (gx < 0.5) gx = 0.5; if (gx > N + 0.5) gx = N + 0.5;
  if (gy < 0.5) gy = 0.5; if (gy > N + 0.5) gy = N + 0.5;
  var i0 = gx|0, j0 = gy|0, s = gx - i0, t = gy - j0;
  return (1-s)*((1-t)*f[IX(i0,j0)] + t*f[IX(i0,j0+1)]) + s*((1-t)*f[IX(i0+1,j0)] + t*f[IX(i0+1,j0+1)]);
}

var cv = document.getElementById('tank'), ctx = cv.getContext('2d');
var vc = document.createElement('canvas'); vc.width = N; vc.height = N;
var vctx = vc.getContext('2d'), vimg = vctx.createImageData(N, N);
var CW = 300, CH = 300, S = 300, ox = 0, oy = 0, dpr = Math.min(2, window.devicePixelRatio || 1);

function resize(){
  var r = cv.parentNode.getBoundingClientRect();
  CW = Math.max(40, r.width); CH = Math.max(40, r.height);
  cv.width = CW*dpr; cv.height = CH*dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.min(CW, CH); ox = (CW - S)/2; oy = (CH - S)/2;
  ctx.fillStyle = '#08151B'; ctx.fillRect(0, 0, CW, CH);
}
new ResizeObserver(resize).observe(cv.parentNode);

function drawVort(){
  var d = vimg.data, i, j;
  for (j = 0; j < N; j++) for (i = 0; i < N; i++){
    var id = IX(i+1, j+1);
    var curl = (v[id+1] - v[id-1] - u[id+W1] + u[id-W1])*0.5*N;
    var t = Math.max(-1, Math.min(1, curl/60)), o = (j*N + i)*4;
    d[o] = 8 + (t > 0 ? t*200 : 0); d[o+1] = 21 + Math.abs(t)*40; d[o+2] = 27 + (t < 0 ? -t*210 : 0); d[o+3] = 255;
  }
  vctx.putImageData(vimg, 0, 0);
  ctx.fillStyle = '#08151B'; ctx.fillRect(0, 0, CW, CH);
  ctx.drawImage(vc, ox, oy, S, S);
}
function render(){
  if (cVort.checked) drawVort();
  else { ctx.fillStyle = 'rgba(8,21,27,0.16)'; ctx.fillRect(0, 0, CW, CH); }
  var sz = Math.max(1.3, S/400);
  for (var b2 = 0; b2 < BINS; b2++){
    ctx.fillStyle = binColor[b2];
    ctx.beginPath();
    for (var k = 0; k < NP; k++){ if (pb[k] !== b2) continue; ctx.rect(ox + px[k]*S, oy + py[k]*S, sz, sz); }
    ctx.fill();
  }
}
function moveParticles(){
  for (var k = 0; k < NP; k++){
    px[k] += sample(u, px[k], py[k])*dt;
    py[k] += sample(v, px[k], py[k])*dt;
    pl[k] -= dt;
    if (pl[k] <= 0 || px[k] < 0 || px[k] > 1 || py[k] < 0 || py[k] > 1) seed(k);
  }
}
function measure(){
  var acc = 0, n = 0, mx = 0, i, j;
  for (j = 2; j <= N-1; j += 2) for (i = 2; i <= N-1; i += 2){
    var id = IX(i,j);
    var dv = (u[id+1] - u[id-1] + v[id+W1] - v[id-W1])*0.5*N;
    acc += dv*dv; n++;
    var sp = u[id]*u[id] + v[id]*v[id];
    if (sp > mx) mx = sp;
  }
  var rms = Math.sqrt(acc/n);
  oDiv.textContent = rms.toFixed(2);
  oDiv.className = rms > 3 ? 'num warn' : 'num';
  oSpdF.textContent = Math.sqrt(mx).toFixed(1);
}

var pdown = false, lx = 0, ly = 0;
function toGrid(e){
  var r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left - ox)/S, y: (e.clientY - r.top - oy)/S };
}
function push(x, y, dx, dy){
  if (x < 0 || x > 1 || y < 0 || y > 1) return;
  var gi = Math.round(x*N) + 1, gj = Math.round(y*N) + 1, F = 900;
  for (var a = -2; a <= 2; a++) for (var b3 = -2; b3 <= 2; b3++){
    var i = gi + a, j = gj + b3;
    if (i < 1 || i > N || j < 1 || j > N) continue;
    var w = Math.exp(-(a*a + b3*b3)/4);
    u0[IX(i,j)] += dx*F*w; v0[IX(i,j)] += dy*F*w;
  }
}
cv.addEventListener('pointerdown', function(e){ pdown = true; var p = toGrid(e); lx = p.x; ly = p.y; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', function(e){
  var p = toGrid(e);
  var s = pdown ? 1 : (e.pointerType === 'mouse' ? 0.35 : 0);
  if (s) push(p.x, p.y, (p.x - lx)*s, (p.y - ly)*s);
  lx = p.x; ly = p.y;
});
cv.addEventListener('pointerup', function(){ pdown = false; });
cv.addEventListener('pointercancel', function(){ pdown = false; });

function stir(){
  for (var k = 0; k < 40; k++){
    var a = k/40*6.2832;
    push(0.5 + 0.18*Math.cos(a), 0.5 + 0.18*Math.sin(a), -0.02*Math.sin(a), 0.02*Math.cos(a));
  }
}
document.getElementById('bStir').addEventListener('click', stir);
document.getElementById('bReset').addEventListener('click', function(){
  u.fill(0); v.fill(0); u0.fill(0); v0.fill(0);
  for (var k = 0; k < NP; k++) seed(k);
  ctx.fillStyle = '#08151B'; ctx.fillRect(0, 0, CW, CH);
});

resize();
stir();
(function loop(){ velStep(); moveParticles(); render(); measure(); requestAnimationFrame(loop); })();
})();

/* ---------- right: vortex blowup ---------- */
(function(){
var cv = document.getElementById('vortex'), ctx = cv.getContext('2d');
var scrub = document.getElementById('sScrub'), btn = document.getElementById('bPlay');
var oTau = document.getElementById('oTau'), oSpd = document.getElementById('oSpd');
var W = 300, H = 300, dpr = Math.min(2, window.devicePixelRatio || 1);

function resize(){
  var r = cv.parentNode.getBoundingClientRect();
  W = Math.max(40, r.width); H = Math.max(40, r.height);
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#08151B'; ctx.fillRect(0, 0, W, H);
}
new ResizeObserver(resize).observe(cv.parentNode);

var NP = 780, P = [];
for (var i = 0; i < NP; i++) P.push({ r: 0.11 + 0.95*Math.sqrt(Math.random()), t: Math.random()*6.2832, z: Math.random()*2 - 1 });

var s = 0, cam = 0.7, tilt = 0.33, last = 0, playing = true;
function state(p, ss){
  var tau = Math.max(0.02, 1 - ss), lam = Math.pow(tau, 0.55);
  var r = p.r*lam, w = 0.9/(0.18 + p.r), th = p.t + w*(-Math.log(tau))*1.7;
  return { x: r*Math.cos(th), z: r*Math.sin(th), y: p.z*Math.pow(tau, -0.35), w: w };
}
function project(x, y, z){
  var ca = Math.cos(cam), sa = Math.sin(cam), X = x*ca - z*sa, D = x*sa + z*ca;
  var tc = Math.cos(tilt), ts = Math.sin(tilt), Y = y*tc - D*ts, dep = y*ts + D*tc;
  var sc = 4.2/(4.2 - dep*0.85), un = Math.min(W, H*1.5)/620;
  return { px: W/2 + X*195*un*sc, py: H/2 - Y*68*un*sc, sc: sc, d: dep };
}
function draw(){
  ctx.clearRect(0, 0, W, H);
  var tau = Math.max(0.02, 1 - s), j;
  ctx.strokeStyle = 'rgba(140,160,166,0.2)'; ctx.lineWidth = 1;
  var a = project(0, -2.6, 0), b = project(0, 2.6, 0);
  ctx.beginPath(); ctx.moveTo(a.px, a.py); ctx.lineTo(b.px, b.py); ctx.stroke();
  var L = [];
  for (j = 0; j < P.length; j++){ var q = state(P[j], s); L.push({ p: P[j], q: q, pr: project(q.x, q.y, q.z) }); }
  L.sort(function(A, B){ return A.pr.d - B.pr.d; });
  var ds = 0.035*tau;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (j = 0; j < L.length; j++){
    var it = L[j], mix = Math.max(0, Math.min(1, (it.q.w - 0.5)/1.8));
    mix = mix*mix*(3 - 2*mix);          /* push inner/outer apart, thin the middle */
    var R = Math.round(38 + 217*mix), G = Math.round(190 - 84*mix), B2 = Math.round(235 - 209*mix);
    ctx.strokeStyle = 'rgba(' + R + ',' + G + ',' + B2 + ',' + Math.max(0.22, Math.min(0.95, it.pr.sc*0.55)) + ')';
    ctx.lineWidth = Math.max(1.7, 3.1*it.pr.sc);
    ctx.beginPath(); ctx.moveTo(it.pr.px, it.pr.py);
    for (var k = 1; k < 6; k++){
      var qq = state(it.p, Math.max(0, s - k*ds)), pp = project(qq.x, qq.y, qq.z);
      ctx.lineTo(pp.px, pp.py);
    }
    ctx.stroke();
  }
  oTau.textContent = tau.toFixed(3);
  oSpd.textContent = Math.pow(tau, -0.45).toFixed(1) + '\u00D7';
}
function setPlaying(on){ playing = on; btn.textContent = on ? 'Pause' : 'Play'; }
scrub.addEventListener('input', function(e){ s = e.target.value/1000; setPlaying(false); });
btn.addEventListener('click', function(){ if (!playing && s >= 0.999) s = 0; setPlaying(!playing); });

var dragging = false, lx = 0, ly = 0;
cv.addEventListener('pointerdown', function(e){ dragging = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', function(e){
  if (!dragging) return;
  cam += (e.clientX - lx)*0.006;
  tilt = Math.max(-1.2, Math.min(1.2, tilt + (e.clientY - ly)*0.005));
  lx = e.clientX; ly = e.clientY;
  if (!playing) draw();
});
cv.addEventListener('pointerup', function(){ dragging = false; });
cv.addEventListener('pointercancel', function(){ dragging = false; });

resize();
(function loop(ts){
  if (!last) last = ts;
  var dt = Math.min(0.05, (ts - last)/1000); last = ts;
  if (playing){
    s += dt*0.1; cam += dt*0.13;
    if (s >= 1){ s = 1; setPlaying(false); }
    scrub.value = Math.round(s*1000);
  }
  draw();
  requestAnimationFrame(loop);
})(0);
})();
</script>
</body>
</html>
