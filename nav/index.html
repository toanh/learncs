<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fluids and singularities</title>
<style>
  :root{
    --bg:#060F13;
    --tank:#08151B;
    --line:#1C2F38;
    --text:#D6E2E7;
    --dim:#7B959F;
    --ui:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:var(--bg);color:var(--text);font-family:var(--ui);font-size:13px}
  #app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:0}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
  header h1{font-size:14px;font-weight:500;margin:0;letter-spacing:0.02em}
  main{display:grid;grid-template-columns:1fr 1fr;min-height:0}
  section{display:grid;grid-template-rows:auto 1fr auto;min-height:0;min-width:0;padding:12px 14px 10px}
  section+section{border-left:1px solid var(--line)}
  h2{font-size:15px;font-weight:500;margin:0 0 8px}
  .stage{position:relative;min-height:0;background:var(--tank);border-radius:2px;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #tank{cursor:crosshair}
  #vortex{cursor:grab}
  #vortex:active{cursor:grabbing}
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:9px;color:var(--dim)}
  label.chk{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}

    main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}

  }

</head>
<body>
<div id="app">

<header>
  <h1>Fluid dynamics and the Navier–Stokes singularity</h1>
  <button id="bFull">Maximise</button>
</header>

<main>

  <section>
    <h2>Push the fluid</h2>
    <div class="stage"><canvas id="tank" aria-label="Fluid tank. Drag to stir."></canvas></div>
    <div class="bar">
      <label class="chk"><input type="checkbox" id="cAdv" checked />Advection</label>
      <label class="chk"><input type="checkbox" id="cDif" checked />Viscosity</label>
      <label class="chk"><input type="checkbox" id="cPrj" checked />Pressure</label>
      <label class="chk"><input type="checkbox" id="cVort" />Vorticity</label>
      <button id="bStir">Stir</button>
      <button id="bReset">Reset</button>
      <label class="chk" style="flex:1;min-width:150px">ν <input type="range" id="sVisc" min="0" max="100" step="1" value="20" style="accent-color:#56C7E0" aria-label="Viscosity" /><span class="num" id="oVisc">0.000020</span></label>
      <span>∇·u <span class="num" id="oDiv">0.00</span></span>
      <span>‖u‖ <span class="num" id="oSpdF">0.0</span></span>
    </div>
  </section>

  <section>
    <h2>A vortex running out of time</h2>
    <div class="stage"><canvas id="vortex" aria-label="Vortex approaching a finite-time singularity. Drag to rotate."></canvas></div>
    <div class="bar">
      <button id="bPlay" style="min-width:74px">Pause</button>
      <input type="range" id="sScrub" min="0" max="1000" step="1" value="0" aria-label="Time toward blowup" />
      <span>T−t <span class="num" id="oTau">1.000</span></span>
      <span>‖u‖ <span class="num" id="oSpd">1.0×</span></span>
    </div>
  </section>

</main>

<script>
document.getElementById('bFull').addEventListener('click', function(){
  var b = this;
  if (!document.fullscreenElement){
    (document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : Promise.reject()).catch(function(){});
  } else if (document.exitFullscreen) { document.exitFullscreen(); }
});
document.addEventListener('fullscreenchange', function(){
  document.getElementById('bFull').textContent = document.fullscreenElement ? 'Exit' : 'Maximise';
});

/* ---------- left: stable fluids ----------

   WHAT THE NAVIER-STOKES EQUATIONS SAY

   The fluid is described by a velocity field u(x,y,t): at every point of the
   tank, and at every instant, there is an arrow saying which way the fluid is
   moving and how fast. Navier-Stokes is just Newton's F = ma written for that
   field of arrows, once for each point:

       du/dt  =  -(u . grad)u  -  grad(p)  +  nu * lap(u)  +  f      ... (1)
       div(u) =  0                                                   ... (2)

   Reading the symbols (all of them are ordinary calculus, applied one
   direction at a time):

     du/dt      how the velocity at a fixed point changes from instant to
                instant. This is the "a" in F = ma; density is taken as 1, so
                the right-hand side is just the sum of the forces.

     grad(q)    the "slope vector" of a quantity q: (dq/dx, dq/dy). It points
                uphill, in the direction q increases fastest.

     div(u)     dU/dx + dV/dy, where u = (U,V). It measures how much fluid is
                spreading out of a point: positive means the point is a source
                (more leaves than arrives), negative means a sink.

     lap(u)     d2U/dx2 + d2U/dy2, the second derivative in space. For a
                bumpy field it is negative at a peak and positive in a dip, so
                it always pulls a value back toward the average of its
                neighbours - it is the smoothing operator.

   Term by term, equation (1) says the velocity at a point changes because:

     -(u . grad)u   ADVECTION. The fluid carries its own velocity along with
                    it, the way a river carries a leaf. This is the only
                    nonlinear term (u appears twice, multiplied by itself) and
                    it is what makes fluids hard: fast flow moves velocity
                    around faster, which can make it faster still. This term
                    is the reason the Navier-Stokes existence-and-smoothness
                    problem is still open, and it is what the right-hand panel
                    is about.

     -grad(p)       PRESSURE. Fluid accelerates from high pressure toward low
                    pressure - downhill on the pressure landscape. Note that
                    equation (1) never says what p is; p is whatever it has to
                    be to keep equation (2) true.

     nu * lap(u)    VISCOSITY. Internal friction. Neighbouring parcels of
                    fluid drag on each other, so velocity diffuses and smooths
                    out. nu (the slider) is how sticky the fluid is: nu near 0
                    is like air, large nu is like honey.

     f              EXTERNAL FORCE. Here, your mouse - see push().

   Equation (2) is INCOMPRESSIBILITY: water cannot be squashed, so whatever
   flows into a small region must flow out again, so the divergence is zero
   everywhere. The readout marked "div.u" shows how close to zero we are; a
   perfect simulation would sit at 0.00.

   HOW THE CODE SOLVES IT

   There is no formula for u(x,y,t), so we approximate. Two approximations:

     1. Space is chopped into an N x N grid of cells; u[] and v[] store the two
        velocity components at the centre of each cell. Derivatives become
        differences between neighbouring cells - e.g. dU/dx at cell i is about
        (u[i+1] - u[i-1]) / (2h), where h = 1/N is the cell width.

     2. Time advances in fixed steps dt. Instead of applying all four terms of
        (1) at once, each step applies them one after another to the whole
        grid - a "splitting" method. One trip through velStep() does:

             add force f   ->   diffuse (viscosity)   ->   project (pressure)
             ->   advect   ->   project (pressure) again

        Each stage is one term of the equation, and the checkboxes let you
        switch a term off to see what it was doing. This is Jos Stam's "Stable
        Fluids" scheme (1999); its selling point is that it never explodes,
        however big dt is, which is why the tank stays well-behaved while you
        scribble in it.

   The arrays: u,v are the current velocity field. u0,v0 are scratch space that
   holds the previous field (or the accumulated force, or the pressure) - the
   code swaps them around rather than allocating new arrays each frame.
*/
(function(){
/* N x N interior cells, plus a one-cell ring of "ghost" cells around the edge
   that holds the wall conditions, so the arrays are (N+2) x (N+2). ITER is how
   many passes the pressure/viscosity equation solver makes. */
var N = 110, W1 = N + 2, SZ = W1 * W1, ITER = 16;
/* The grid is stored as one flat array; IX turns a column,row pair into an
   index. So a cell's four neighbours are at id-1, id+1, id-W1, id+W1. */
function IX(i,j){ return i + W1 * j; }
var u = new Float32Array(SZ), v = new Float32Array(SZ);
var u0 = new Float32Array(SZ), v0 = new Float32Array(SZ);
/* visc is nu, the viscosity in equation (1). dt is the length of one time step. */
var visc = 0.00002, dt = 0.11;

var cAdv = document.getElementById('cAdv'), cDif = document.getElementById('cDif'),
    cPrj = document.getElementById('cPrj'), cVort = document.getElementById('cVort'),
    oDiv = document.getElementById('oDiv'), oSpdF = document.getElementById('oSpdF'),
    sVisc = document.getElementById('sVisc'), oVisc = document.getElementById('oVisc');

/* The slider sets nu. Useful viscosities span several powers of ten, so the
   slider position is used as an exponent rather than as the value itself:
   position 0 -> nu = 0 (no friction at all), position 100 -> nu ~ 0.0025. */
function readVisc(){
  var t = sVisc.value/100;
  visc = t === 0 ? 0 : 0.000001*Math.pow(10, t*3.4);
  oVisc.textContent = visc.toFixed(6);
}
sVisc.addEventListener('input', readVisc);
readVisc();

/* BOUNDARY CONDITIONS - the walls of the tank.

   A differential equation only has one answer once you say what happens at the
   edges. Physically the tank has solid walls: fluid cannot flow through them.
   So the ghost cell just outside a wall is filled in to force that:

     b === 1  the array is the horizontal velocity U, and this is a left/right
              wall, so copy the neighbour with the sign flipped. The average of
              x and -x is 0, so the flow across the wall is zero: it bounces.
     b === 2  same thing for the vertical velocity V at the top/bottom walls.
     b === 0  the array is a scalar (pressure, divergence). Nothing to reflect,
              so copy the neighbour unchanged - "no gradient across the wall".

   Corner cells have no single neighbour, so they take the average of the two.
   Every stage below calls this at the end, otherwise the edges would leak. */
function setBnd(b, x){
  for (var i = 1; i <= N; i++){
    x[IX(0,i)]   = b === 1 ? -x[IX(1,i)] : x[IX(1,i)];
    x[IX(N+1,i)] = b === 1 ? -x[IX(N,i)] : x[IX(N,i)];
    x[IX(i,0)]   = b === 2 ? -x[IX(i,1)] : x[IX(i,1)];
    x[IX(i,N+1)] = b === 2 ? -x[IX(i,N)] : x[IX(i,N)];
  }
  x[IX(0,0)]     = 0.5*(x[IX(1,0)]   + x[IX(0,1)]);
  x[IX(0,N+1)]   = 0.5*(x[IX(1,N+1)] + x[IX(0,N)]);
  x[IX(N+1,0)]   = 0.5*(x[IX(N,0)]   + x[IX(N+1,1)]);
  x[IX(N+1,N+1)] = 0.5*(x[IX(N,N+1)] + x[IX(N+1,N)]);
}
/* SOLVING FOR A FIELD THAT DEPENDS ON ITS OWN NEIGHBOURS.

   Both the viscosity step and the pressure step end up asking the same kind of
   question: find a value in every cell such that each cell equals some known
   quantity plus a share of its four neighbours,

       x[cell] * c  =  xs[cell]  +  a * (sum of x at the four neighbours)

   You cannot just evaluate that left to right, because every cell's answer
   depends on cells you have not worked out yet. It is one giant simultaneous
   equation - N*N unknowns, far too many to solve exactly at 60 frames a
   second.

   Instead, guess and iterate (Gauss-Seidel relaxation). Start from whatever is
   in x, sweep the grid rearranging the formula to give a better x for each
   cell, fix the walls, and repeat ITER times. The values settle toward the
   true answer. 16 sweeps is nowhere near converged, but it is close enough to
   look right - the honest trade this whole simulation makes.

   Note the sweep is IN PLACE, so within one pass x[id-1] and x[id-W1] have
   already been updated this sweep while x[id+1] and x[id+W1] are still from
   the last one. Each cell therefore uses a mix of new and old neighbours.
   That is deliberate: the fresher values propagate immediately down and to
   the right, so one sweep carries information across the whole grid in the
   sweep direction (and only one cell against it).

   The alternative is Jacobi iteration: read every neighbour from a frozen
   copy of the previous sweep, write into a second array, swap at the end.
   That is symmetric and order-independent, but it converges about half as
   fast - measured on this grid, Jacobi needs 32 sweeps to reach what
   Gauss-Seidel reaches in 16 - and it costs an extra buffer. Gauss-Seidel
   wins on one CPU thread. Jacobi wins the moment you go parallel, because
   every cell can be computed independently, which is why GPU fluid solvers
   almost always use it. Red-black Gauss-Seidel (update chequerboard-style in
   two passes) gets both, if you ever need it.

   The asymmetry does bias the result slightly toward the sweep direction.
   At 16 sweeps, in a tank of drifting dye, it is invisible.

   a and c are the coefficients; they are set differently for viscosity and for
   pressure, see velStep() and project(). */
function linSolve(b, x, xs, a, c){
  var invc = 1/c, i, j, k, id;
  for (k = 0; k < ITER; k++){
    for (j = 1; j <= N; j++){
      for (i = 1; i <= N; i++){
        id = IX(i,j);
        /* x[id-1], x[id+1], x[id-W1], x[id+W1] are the left, right, upper and
           lower neighbours - the discrete Laplacian's four-point stencil. */
        x[id] = (xs[id] + a*(x[id-1] + x[id+1] + x[id-W1] + x[id+W1])) * invc;
      }
    }
    setBnd(b, x);
  }
}
/* ADVECTION - the -(u . grad)u term, the "fluid carries itself" one.
   Checkbox: Advection.

   The obvious approach is to push each cell's value forward along the flow,
   but that scatters values between cells and blows up when dt is large. Stam's
   trick is to run time BACKWARDS instead, and it is the reason this simulation
   never explodes:

     For cell (i,j), ask: one time step ago, where was the fluid that has just
     arrived here? Answer: at (i,j) minus velocity * dt. Go to that spot in the
     old field d0 and copy whatever value was there.

   That spot almost never lands exactly on a cell centre, so the value is
   read out with bilinear interpolation - a weighted average of the four cells
   surrounding it, weights s0,s1 across and t0,t1 down. (s1 is how far past the
   left cell the point sits, so s0 = 1 - s1 is the left cell's share.)

   Because every new value is an average of old values, it can never exceed the
   largest old value. Nothing can grow without bound; worst case the picture
   gets blurry. That is the whole reason the solver is called "stable".

   dt0 = dt*N converts a velocity in tank-widths-per-second into a distance in
   grid cells. The clamps to [0.5, N+0.5] stop a fast flow from reaching for a
   cell outside the grid. */
function advect(b, d, d0, uu, vv){
  var dt0 = dt * N, i, j;
  for (j = 1; j <= N; j++){
    for (i = 1; i <= N; i++){
      var id = IX(i,j);
      /* step backwards down the velocity arrow to find where this came from */
      var x = i - dt0*uu[id], y = j - dt0*vv[id];
      if (x < 0.5) x = 0.5; if (x > N + 0.5) x = N + 0.5;
      if (y < 0.5) y = 0.5; if (y > N + 0.5) y = N + 0.5;
      /* i0,j0 = the cell that point lands in; s,t = the fractional part */
      var i0 = x|0, j0 = y|0, s1 = x - i0, s0 = 1 - s1, t1 = y - j0, t0 = 1 - t1;
      /* blend the four cells around that point, weighted by how near each is */
      d[id] = s0*(t0*d0[IX(i0,j0)] + t1*d0[IX(i0,j0+1)]) + s1*(t0*d0[IX(i0+1,j0)] + t1*d0[IX(i0+1,j0+1)]);
    }
  }
  setBnd(b, d);
}
/* PRESSURE - the -grad(p) term, and the way equation (2) is enforced.
   Checkbox: Pressure.

   After the force, viscosity and advection stages, the velocity field is
   wrong: it has cells acting as sources and sinks, div(u) != 0, so fluid is
   appearing and vanishing. Water does not do that. The pressure term's only
   job is to fix it. Turn the checkbox off and watch the particles pile up and
   thin out instead of swirling - that is a compressible mess.

   The mathematical fact this rests on (the Helmholtz decomposition) is that
   ANY velocity field can be split into exactly two parts:

       (what we have)  =  (a divergence-free swirl)  +  grad(p)

   The swirl is the physically legal flow we want to keep. So compute p, then
   subtract grad(p), and what is left is guaranteed divergence-free. This is
   called a "projection" for the same reason as in vectors: it drops the
   component pointing in the illegal direction, keeping only the legal part.

   Three steps below:

     1. Measure the problem. div = -h * div(u), using centred differences:
        dU/dx is about (U at i+1 - U at i-1)/2h, and likewise dV/dy. The factor
        of h and the minus sign are folded in here so that step 2 can use tidy
        coefficients.

     2. Find p. Taking the divergence of the split above gives Poisson's
        equation, lap(p) = div(u): the pressure whose smoothing-operator value
        matches the divergence we measured. Discretised, that is exactly the
        neighbour-average problem linSolve handles, with a = 1 and c = 4
        (four neighbours). So the pressure is not an independent variable with
        its own physics here - it is solved for, purely as the field that
        cancels the divergence.

     3. Subtract grad(p) from the velocity: each cell accelerates from high
        pressure toward low. Where fluid was piling up, pressure is high and
        this pushes it apart; where it was thinning out, this pulls it back.

   p and div are passed in as the scratch arrays u0 and v0 - the previous
   velocity has already been used by this point in velStep(). */
function project(uu, vv, p, div){
  var i, j, h = 1/N;
  for (j = 1; j <= N; j++) for (i = 1; i <= N; i++){
    /* 1. how badly does each cell violate div(u) = 0? */
    div[IX(i,j)] = -0.5*h*(uu[IX(i+1,j)] - uu[IX(i-1,j)] + vv[IX(i,j+1)] - vv[IX(i,j-1)]);
    p[IX(i,j)] = 0;
  }
  setBnd(0, div); setBnd(0, p);
  /* 2. solve lap(p) = div(u) for the pressure */
  linSolve(0, p, div, 1, 4);
  for (j = 1; j <= N; j++) for (i = 1; i <= N; i++){
    /* 3. u <- u - grad(p): flow downhill on the pressure landscape */
    uu[IX(i,j)] -= 0.5*(p[IX(i+1,j)] - p[IX(i-1,j)])/h;
    vv[IX(i,j)] -= 0.5*(p[IX(i,j+1)] - p[IX(i,j-1)])/h;
  }
  setBnd(1, uu); setBnd(2, vv);
}
/* ONE TIME STEP OF NAVIER-STOKES.

   This is the whole equation, assembled. Rather than applying all four terms
   of (1) at once, each is applied in turn to the result of the last - so over
   one step of length dt the velocity field receives every effect exactly once.
   Reading top to bottom is reading the equation left to right.

   The u/u0 swaps are just double-buffering: several stages need to read a
   complete "before" field while writing a complete "after" field, so the two
   arrays trade roles instead of being copied. After a swap, u0 holds the
   input and u is where the answer goes. */
function velStep(){
  var i, t;

  /* TERM f - external force. u0,v0 currently hold the force accumulated by
     push() since the last frame; du/dt = f integrates to u += dt*f. */
  for (i = 0; i < SZ; i++){ u[i] += dt*u0[i]; v[i] += dt*v0[i]; }

  /* TERM nu*lap(u) - viscosity, applied to each velocity component in turn.

     The naive version, u_new = u_old + dt*nu*lap(u_old), explodes if dt or nu
     is large: a cell overshoots past its neighbours' average, then overshoots
     back further, oscillating wildly. So solve it IMPLICITLY instead - demand
     a new field that, if you diffused it backwards by one step, would give the
     old one:

         u_new - dt*nu*lap(u_new) = u_old

     Every cell now depends on its neighbours, which is exactly linSolve's
     problem, with a = dt*nu*N*N (the N*N converts nu into grid-cell units,
     since lap involves 1/h^2 and h = 1/N) and c = 1 + 4a. This version is
     stable for any dt: it can only ever smooth, never overshoot.

     Unchecked, u.set(u0) copies the field through untouched - an inviscid
     ("perfect", frictionless) fluid, the nu = 0 case, which is the Euler
     equation rather than Navier-Stokes. */
  t = u0; u0 = u; u = t;
  if (cDif.checked){ var a = dt*visc*N*N; linSolve(1, u, u0, a, 1 + 4*a); } else u.set(u0);
  t = v0; v0 = v; v = t;
  if (cDif.checked){ var a2 = dt*visc*N*N; linSolve(2, v, v0, a2, 1 + 4*a2); } else v.set(v0);

  /* TERM -grad(p) - clean up the divergence the force and viscosity left,
     so that advection is carrying the flow along a field that conserves mass */
  if (cPrj.checked) project(u, v, u0, v0);

  /* TERM -(u . grad)u - the flow carries its own velocity along. Both
     components must be advected by the SAME field, so the pre-advection
     velocity is swapped into u0,v0 and used as the transport field for both
     calls (note u0,v0 appear as the last two arguments each time). */
  if (cAdv.checked){
    t = u0; u0 = u; u = t;
    t = v0; v0 = v; v = t;
    advect(1, u, u0, u0, v0);
    advect(2, v, v0, u0, v0);
  }

  /* -grad(p) again: advection has just reshuffled the velocities, which
     reintroduces divergence, so project a second time. The field the renderer
     finally sees is the one that came out of a projection - so it satisfies
     equation (2) to within the accuracy of 16 linSolve sweeps. */
  if (cPrj.checked) project(u, v, u0, v0);

  /* Not physics - a safety net. Turning terms off mid-flow (especially
     pressure) can leave the field genuinely unphysical, so clamp the speed and
     scrub any NaN/Infinity rather than letting one bad cell poison the grid. */
  for (i = 0; i < SZ; i++){
    if (!isFinite(u[i])) u[i] = 0;
    if (!isFinite(v[i])) v[i] = 0;
    if (u[i] > 60) u[i] = 60; else if (u[i] < -60) u[i] = -60;
    if (v[i] > 60) v[i] = 60; else if (v[i] < -60) v[i] = -60;
  }
  /* force has been spent; clear the accumulator ready for the next frame */
  u0.fill(0); v0.fill(0);
}

/* The particles are only paint. They carry no physics and do not affect the
   velocity field at all - they are massless tracers dropped in so the
   invisible field u(x,y,t) becomes visible, the way dye or smoke is used in a
   real experiment. They are colour-banded by starting column so you can watch
   advection fold and stretch the bands together. */
var NP = 3200, px = new Float32Array(NP), py = new Float32Array(NP),
    pb = new Uint8Array(NP), pl = new Float32Array(NP), BINS = 8, binColor = [];
for (var b = 0; b < BINS; b++){
  var m = b/(BINS-1);
  binColor.push('rgba(' + Math.round(86+156*m) + ',' + Math.round(199-38*m) + ',' + Math.round(224-161*m) + ',0.85)');
}
function seed(k){ px[k] = Math.random(); py[k] = Math.random(); pb[k] = Math.min(BINS-1,(px[k]*BINS)|0); pl[k] = 6 + Math.random()*10; }
for (var k0 = 0; k0 < NP; k0++) seed(k0);

/* Read the field f at any point of the tank, not just at a cell centre, by
   bilinear interpolation between the four surrounding cells - the same
   averaging advect() uses. x,y are in 0..1 tank coordinates. */
function sample(f, x, y){
  var gx = x*N + 0.5, gy = y*N + 0.5;
  if (gx < 0.5) gx = 0.5; if (gx > N + 0.5) gx = N + 0.5;
  if (gy < 0.5) gy = 0.5; if (gy > N + 0.5) gy = N + 0.5;
  var i0 = gx|0, j0 = gy|0, s = gx - i0, t = gy - j0;
  return (1-s)*((1-t)*f[IX(i0,j0)] + t*f[IX(i0,j0+1)]) + s*((1-t)*f[IX(i0+1,j0)] + t*f[IX(i0+1,j0+1)]);
}

var cv = document.getElementById('tank'), ctx = cv.getContext('2d');
var vc = document.createElement('canvas'); vc.width = N; vc.height = N;
var vctx = vc.getContext('2d'), vimg = vctx.createImageData(N, N);
var CW = 300, CH = 300, S = 300, ox = 0, oy = 0, dpr = Math.min(2, window.devicePixelRatio || 1);

function resize(){
  var r = cv.parentNode.getBoundingClientRect();
  CW = Math.max(40, r.width); CH = Math.max(40, r.height);
  cv.width = CW*dpr; cv.height = CH*dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.min(CW, CH); ox = (CW - S)/2; oy = (CH - S)/2;
  ctx.fillStyle = '#08151B'; ctx.fillRect(0, 0, CW, CH);
}
new ResizeObserver(resize).observe(cv.parentNode);

/* VORTICITY (curl), the checkbox that tints the background.

   Divergence asks how much fluid is spreading out of a point; vorticity asks
   how much it is SPINNING there:

       curl(u) = dV/dx - dU/dy

   Picture a tiny paddle wheel dropped in the flow. If the vertical velocity
   grows as you move right, or the horizontal velocity grows as you move down,
   the wheel turns. Positive curl is anticlockwise (drawn warm/red here),
   negative is clockwise (cool/blue), zero is the background colour.

   Vorticity is where the interesting behaviour of a fluid lives - and it is
   what the right-hand panel tracks, because the open Navier-Stokes problem is
   essentially the question of whether vorticity can become infinite in finite
   time. curl/60 scales it into -1..1 for the colour ramp. */
function drawVort(){
  var d = vimg.data, i, j;
  for (j = 0; j < N; j++) for (i = 0; i < N; i++){
    var id = IX(i+1, j+1);
    /* centred differences again: dV/dx - dU/dy, times N for the 1/h */
    var curl = (v[id+1] - v[id-1] - u[id+W1] + u[id-W1])*0.5*N;
    var t = Math.max(-1, Math.min(1, curl/60)), o = (j*N + i)*4;
    d[o] = 8 + (t > 0 ? t*200 : 0); d[o+1] = 21 + Math.abs(t)*40; d[o+2] = 27 + (t < 0 ? -t*210 : 0); d[o+3] = 255;
  }
  vctx.putImageData(vimg, 0, 0);
  ctx.fillStyle = '#08151B'; ctx.fillRect(0, 0, CW, CH);
  ctx.drawImage(vc, ox, oy, S, S);
}
function render(){
  if (cVort.checked) drawVort();
  else { ctx.fillStyle = 'rgba(8,21,27,0.16)'; ctx.fillRect(0, 0, CW, CH); }
  var sz = Math.max(1.3, S/400);
  for (var b2 = 0; b2 < BINS; b2++){
    ctx.fillStyle = binColor[b2];
    ctx.beginPath();
    for (var k = 0; k < NP; k++){ if (pb[k] !== b2) continue; ctx.rect(ox + px[k]*S, oy + py[k]*S, sz, sz); }
    ctx.fill();
  }
}
/* Float each tracer along the flow: position += velocity-at-that-position * dt.
   This is the definition of the velocity field being acted out - a particle
   goes wherever the arrow under it points. Particles also expire (pl is a
   lifetime) and get reseeded, so the picture keeps refreshing instead of all
   the dye ending up trapped in one eddy. */
function moveParticles(){
  for (var k = 0; k < NP; k++){
    px[k] += sample(u, px[k], py[k])*dt;
    py[k] += sample(v, px[k], py[k])*dt;
    pl[k] -= dt;
    if (pl[k] <= 0 || px[k] < 0 || px[k] > 1 || py[k] < 0 || py[k] > 1) seed(k);
  }
}
/* The two readouts under the tank.

   div.u is the root-mean-square of div(u) over the grid: square every cell's
   divergence, average, square-root. Squaring first stops positive and negative
   errors cancelling out and hiding the problem. Equation (2) says this should
   be 0; with Pressure ticked it stays near zero, and it turns orange past 3.
   Untick Pressure and watch it climb - that is mass conservation failing.

   ||u|| is the largest speed anywhere on the grid, sqrt(U^2 + V^2). Sampling
   every second cell is a speed optimisation; it is a display value, not
   physics. */
function measure(){
  var acc = 0, n = 0, mx = 0, i, j;
  for (j = 2; j <= N-1; j += 2) for (i = 2; i <= N-1; i += 2){
    var id = IX(i,j);
    var dv = (u[id+1] - u[id-1] + v[id+W1] - v[id-W1])*0.5*N;
    acc += dv*dv; n++;
    var sp = u[id]*u[id] + v[id]*v[id];
    if (sp > mx) mx = sp;
  }
  var rms = Math.sqrt(acc/n);
  oDiv.textContent = rms.toFixed(2);
  oDiv.className = rms > 3 ? 'num warn' : 'num';
  oSpdF.textContent = Math.sqrt(mx).toFixed(1);
}

var pdown = false, lx = 0, ly = 0;
function toGrid(e){
  var r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left - ox)/S, y: (e.clientY - r.top - oy)/S };
}
/* TERM f - the external force, i.e. you.

   dx,dy is how far the pointer moved since the last event, which stands in for
   the direction and strength of the shove. The force is written into u0,v0,
   the accumulator that velStep() will integrate at the start of the next step.

   The push is spread over a 5x5 patch with Gaussian weights, w = e^(-r^2/4),
   strongest at the centre and fading with distance. A force applied to a
   single cell would be a spike the grid cannot represent - it would just
   produce noise that the pressure step immediately fights. A smooth blob
   behaves like a real finger dragged through water. */
function push(x, y, dx, dy){
  if (x < 0 || x > 1 || y < 0 || y > 1) return;
  var gi = Math.round(x*N) + 1, gj = Math.round(y*N) + 1, F = 900;
  for (var a = -2; a <= 2; a++) for (var b3 = -2; b3 <= 2; b3++){
    var i = gi + a, j = gj + b3;
    if (i < 1 || i > N || j < 1 || j > N) continue;
    var w = Math.exp(-(a*a + b3*b3)/4);
    u0[IX(i,j)] += dx*F*w; v0[IX(i,j)] += dy*F*w;
  }
}
cv.addEventListener('pointerdown', function(e){ pdown = true; var p = toGrid(e); lx = p.x; ly = p.y; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', function(e){
  var p = toGrid(e);
  var s = pdown ? 1 : (e.pointerType === 'mouse' ? 0.35 : 0);
  if (s) push(p.x, p.y, (p.x - lx)*s, (p.y - ly)*s);
  lx = p.x; ly = p.y;
});
cv.addEventListener('pointerup', function(){ pdown = false; });
cv.addEventListener('pointercancel', function(){ pdown = false; });

/* Apply force at 40 points around a circle, each tangent to it (the direction
   (-sin a, cos a) is perpendicular to the radius (cos a, sin a)), which spins
   up a single clean vortex to start from. */
function stir(){
  for (var k = 0; k < 40; k++){
    var a = k/40*6.2832;
    push(0.5 + 0.18*Math.cos(a), 0.5 + 0.18*Math.sin(a), -0.02*Math.sin(a), 0.02*Math.cos(a));
  }
}
document.getElementById('bStir').addEventListener('click', stir);
document.getElementById('bReset').addEventListener('click', function(){
  u.fill(0); v.fill(0); u0.fill(0); v0.fill(0);
  for (var k = 0; k < NP; k++) seed(k);
  ctx.fillStyle = '#08151B'; ctx.fillRect(0, 0, CW, CH);
});

resize();
stir();
/* The main loop, once per animation frame: advance the physics by one dt,
   float the tracers along the new field, draw, update the readouts. */
(function loop(){ velStep(); moveParticles(); render(); measure(); requestAnimationFrame(loop); })();
})();

/* ---------- right: vortex blowup ---------- */
(function(){
var cv = document.getElementById('vortex'), ctx = cv.getContext('2d');
var scrub = document.getElementById('sScrub'), btn = document.getElementById('bPlay');
var oTau = document.getElementById('oTau'), oSpd = document.getElementById('oSpd');
var W = 300, H = 300, dpr = Math.min(2, window.devicePixelRatio || 1);

function resize(){
  var r = cv.parentNode.getBoundingClientRect();
  W = Math.max(40, r.width); H = Math.max(40, r.height);
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#08151B'; ctx.fillRect(0, 0, W, H);
}
new ResizeObserver(resize).observe(cv.parentNode);

var NP = 780, P = [];
for (var i = 0; i < NP; i++) P.push({ r: 0.11 + 0.95*Math.sqrt(Math.random()), t: Math.random()*6.2832, z: Math.random()*2 - 1 });

var s = 0, cam = 0.7, tilt = 0.33, last = 0, playing = true;
function state(p, ss){
  var tau = Math.max(0.02, 1 - ss), lam = Math.pow(tau, 0.55);
  var r = p.r*lam, w = 0.9/(0.18 + p.r), th = p.t + w*(-Math.log(tau))*1.7;
  return { x: r*Math.cos(th), z: r*Math.sin(th), y: p.z*Math.pow(tau, -0.35), w: w };
}
function project(x, y, z){
  var ca = Math.cos(cam), sa = Math.sin(cam), X = x*ca - z*sa, D = x*sa + z*ca;
  var tc = Math.cos(tilt), ts = Math.sin(tilt), Y = y*tc - D*ts, dep = y*ts + D*tc;
  var sc = 4.2/(4.2 - dep*0.85), un = Math.min(W, H*1.5)/620;
  return { px: W/2 + X*195*un*sc, py: H/2 - Y*68*un*sc, sc: sc, d: dep };
}
function draw(){
  ctx.clearRect(0, 0, W, H);
  var tau = Math.max(0.02, 1 - s), j;
  ctx.strokeStyle = 'rgba(140,160,166,0.2)'; ctx.lineWidth = 1;
  var a = project(0, -2.6, 0), b = project(0, 2.6, 0);
  ctx.beginPath(); ctx.moveTo(a.px, a.py); ctx.lineTo(b.px, b.py); ctx.stroke();
  var L = [];
  for (j = 0; j < P.length; j++){ var q = state(P[j], s); L.push({ p: P[j], q: q, pr: project(q.x, q.y, q.z) }); }
  L.sort(function(A, B){ return A.pr.d - B.pr.d; });
  var ds = 0.035*tau;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (j = 0; j < L.length; j++){
    var it = L[j], mix = Math.max(0, Math.min(1, (it.q.w - 0.5)/1.8));
    mix = mix*mix*(3 - 2*mix);          /* push inner/outer apart, thin the middle */
    var R = Math.round(38 + 217*mix), G = Math.round(190 - 84*mix), B2 = Math.round(235 - 209*mix);
    ctx.strokeStyle = 'rgba(' + R + ',' + G + ',' + B2 + ',' + Math.max(0.22, Math.min(0.95, it.pr.sc*0.55)) + ')';
    ctx.lineWidth = Math.max(1.7, 3.1*it.pr.sc);
    ctx.beginPath(); ctx.moveTo(it.pr.px, it.pr.py);
    for (var k = 1; k < 6; k++){
      var qq = state(it.p, Math.max(0, s - k*ds)), pp = project(qq.x, qq.y, qq.z);
      ctx.lineTo(pp.px, pp.py);
    }
    ctx.stroke();
  }
  oTau.textContent = tau.toFixed(3);
  oSpd.textContent = Math.pow(tau, -0.45).toFixed(1) + '\u00D7';
}
function setPlaying(on){ playing = on; btn.textContent = on ? 'Pause' : 'Play'; }
scrub.addEventListener('input', function(e){ s = e.target.value/1000; setPlaying(false); });
btn.addEventListener('click', function(){ if (!playing && s >= 0.999) s = 0; setPlaying(!playing); });

var dragging = false, lx = 0, ly = 0;
cv.addEventListener('pointerdown', function(e){ dragging = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', function(e){
  if (!dragging) return;
  cam += (e.clientX - lx)*0.006;
  tilt = Math.max(-1.2, Math.min(1.2, tilt + (e.clientY - ly)*0.005));
  lx = e.clientX; ly = e.clientY;
  if (!playing) draw();
});
cv.addEventListener('pointerup', function(){ dragging = false; });
cv.addEventListener('pointercancel', function(){ dragging = false; });

resize();
(function loop(ts){
  if (!last) last = ts;
  var dt = Math.min(0.05, (ts - last)/1000); last = ts;
  if (playing){
    s += dt*0.1; cam += dt*0.13;
    if (s >= 1){ s = 1; setPlaying(false); }
    scrub.value = Math.round(s*1000);
  }
  draw();
  requestAnimationFrame(loop);
})(0);
})();
</script>
</body>
</html>
